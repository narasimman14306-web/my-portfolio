name: Build LevelUp Buddy Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: levelup-buddy/package-lock.json

      - name: Install Web Dependencies
        working-directory: levelup-buddy
        run: npm ci || npm install

      - name: Build Web Application
        working-directory: levelup-buddy
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: levelup-buddy
        run: npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK with Gradle
        working-directory: levelup-buddy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Buddy-v1.0-Debug-APK
          path: levelup-buddy/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
