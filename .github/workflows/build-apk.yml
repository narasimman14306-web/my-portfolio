name: Build LevelUp Buddy Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        working-directory: levelup-buddy
        run: npm install

      - name: Build Web Application
        working-directory: levelup-buddy
        run: npm run build

      - name: Sync Web Assets & Capacitor Plugins
        working-directory: levelup-buddy
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npm run cap:sync || npx cap sync || true

      - name: Build Debug APK with Gradle
        working-directory: levelup-buddy/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Buddy-Debug-APK
          path: levelup-buddy/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
